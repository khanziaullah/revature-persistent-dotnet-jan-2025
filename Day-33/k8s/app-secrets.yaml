# ──────────────────────────────────────────────────────────────────
# app-secrets.yaml
# Sensitive configuration — passwords, connection strings, keys
#
# All values MUST be base64-encoded:
#   echo -n "your-value-here" | base64
#
# ⚠️  Do NOT commit this file with real values to source control.
#     Use a .gitignore entry or a secrets manager in production.
# ──────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
data:
  # SQL Server SA password
  # echo -n "YourPassword123!" | base64
  SA_PASSWORD: WW91clBhc3N3b3JkMTIzIQ==

  # Full SQL Server connection string
  # echo -n "Server=sqlserver-svc,1433;Database=AppDatabase;User Id=sa;Password=YourPassword123!;TrustServerCertificate=True;" | base64
  SQL_CONNECTION: U2VydmVyPXNxbHNlcnZlci1zdmMsMTQzMztEYXRhYmFzZT1BcHBEYXRhYmFzZTtVc2VyIElkPXNhO1Bhc3N3b3JkPVlvdXJQYXNzd29yZDEyMyE7VHJ1c3RTZXJ2ZXJDZXJ0aWZpY2F0ZT1UcnVlOw==

  # Redis password (leave empty string if no auth: echo -n "" | base64 = "")
  REDIS_PASSWORD: ""

  # MongoDB connection string
  # echo -n "mongodb://mongodb-svc:27017/AppMongo" | base64
  MONGO_CONNECTION: bW9uZ29kYjovL21vbmdvZGItc3ZjOjI3MDE3L0FwcE1vbmdv

  # JWT signing key (replace with a strong random string)
  # echo -n "your-super-secret-jwt-key-min-32-chars" | base64
  JWT_SECRET: eW91ci1zdXBlci1zZWNyZXQtand0LWtleS1taW4tMzItY2hhcnM=
