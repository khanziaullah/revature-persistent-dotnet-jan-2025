# ──────────────────────────────────────────────────────────────────
# ui-service.yaml
# Exposes the React UI via a LoadBalancer Service on port 3000
# ──────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: react-ui-svc
  labels:
    app: react-ui
spec:
  type: LoadBalancer
  selector:
    app: react-ui
  ports:
  - name: http
    protocol: TCP
    port: 3000                # hit from outside at localhost:3000
    targetPort: 80            # nginx listens on 80 inside the container
