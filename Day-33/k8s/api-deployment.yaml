# ──────────────────────────────────────────────────────────────────
# api-deployment.yaml
# Deploys the .NET 8 API as a Kubernetes Deployment (2 replicas)
# Replace YOUR_DOCKERHUB_USERNAME before applying
# ──────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dotnet-api
  labels:
    app: dotnet-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dotnet-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0     # never have fewer than desired during update
      maxSurge: 1           # allow one extra pod during rollout
  template:
    metadata:
      labels:
        app: dotnet-api
    spec:
      containers:
      - name: api
        image: YOUR_DOCKERHUB_USERNAME/dotnet-api:1.0
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Development"
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        # Liveness probe: restart container if it stops responding
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        # Readiness probe: only send traffic when the app is ready
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
